name: Build and publish Plasma package

on:
  push:
    branches:
      - master
    paths:
      - 'Chorus/**'
      - '.github/workflows/release-plasmoid.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate provider JavaScript and regression tests
        shell: bash
        run: |
          sed -E '/^\.(pragma|import)[[:space:]]/d' Chorus/contents/code/providers.js > /tmp/providers.js
          node --check /tmp/providers.js
          node --test tests/providers.test.cjs

      - name: Read package version
        id: meta
        shell: bash
        run: |
          version="$(jq -r '.KPlugin.Version' Chorus/metadata.json)"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not read KPlugin.Version from Chorus/metadata.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip an already published version
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Plasma applet
        if: steps.exists.outputs.exists != 'true'
        shell: bash
        run: |
          artifact="chorus-plus-v${{ steps.meta.outputs.version }}.plasmoid"
          (cd Chorus && zip -qr "../$artifact" .)
          unzip -tq "$artifact"
          unzip -Z1 "$artifact" | grep -qx 'metadata.json'
          unzip -Z1 "$artifact" | grep -qx 'contents/code/providers.js'

      - name: Create GitHub release and attach package
        if: steps.exists.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARTIFACT: chorus-plus-v${{ steps.meta.outputs.version }}.plasmoid
        shell: bash
        run: |
          gh release create "$TAG" "$ARTIFACT" \
            --title "Chorus Plus v${VERSION}" \
            --generate-notes \
            --target "$GITHUB_SHA"